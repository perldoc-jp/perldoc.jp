name: Deploy Worker

# Worker のコードは Cloud Run のイメージとは独立しているので、
# worker/ が変わったときだけデプロイする
on:
  push:
    branches:
      - master
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # CLOUDFLARE_API_TOKEN はこの environment の secret に置く (docs/cloud-run.md §6)。
    # environment の deployment branch policy が master のみを許可するため、
    # workflow_dispatch で他の ref を選んでもジョブ開始前に拒否される。
    # yml 内の ref ガードは、workflow_dispatch では実行者が選んだ ref の
    # yml ごと差し替えられるため防御にならない。GCP 側 (deploy.yml) を WIF の
    # attribute-condition で master に固定しているのと同じ境界
    environment: cloudflare-production

    steps:
      # 外部 action はコミット SHA にピン留めする (この workflow は Cloudflare の
      # API トークンを扱うため)。更新時は SHA とコメントのバージョンを両方書き換えること
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # test.yml の worker-test と同じゲートをデプロイ直前にも置く
      # (workflow_dispatch は PR を経由しないため)
      - name: Run tests
        working-directory: worker
        run: node --test

      # cloudflare/wrangler-action は使わず npm で入れて呼ぶ。ピン留めが必要な
      # 外部 action を増やさないため。
      #
      # インストールは Cloudflare API トークンを持たない step で行う。
      # npx --yes wrangler@<ver> の形はトップレベルしか固定できず、依存グラフの
      # 奥 (wrangler → miniflare → sharp → detect-libc / semver) には semver
      # range が残る。sharp は install フックでその range 越しのコードを実行する
      # ため、トークンを env に置いたまま install すると、依存の乗っ取りが
      # そのままトークンの奪取になる。この workflow が外部 action を
      # コミット SHA に固定しているのと同じ理由。
      - name: Install wrangler
        working-directory: worker
        run: npm ci

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUD_RUN_URL: ${{ vars.CLOUD_RUN_URL }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          # 空の ORIGIN でデプロイすると Worker が全リクエストで例外を投げるので、
          # 変数の設定漏れはここで落とす
          test -n "$CLOUD_RUN_URL"
          # --offline で、この step がレジストリに触れない (= 追加の
          # インストールが走らない) ことを保証する
          npm exec --offline --no -- wrangler deploy --var "ORIGIN:$CLOUD_RUN_URL"
