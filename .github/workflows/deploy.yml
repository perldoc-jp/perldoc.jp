name: Deploy

on:
  push:
    branches:
      - master
  # perldoc-jp/translation の push を受けて再ビルドする
  repository_dispatch:
    types:
      - translation-updated
  # repository_dispatch の取りこぼし保険 (JST 4:00)
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# permissions はジョブレベルで宣言する。WIF の資格情報を扱う deploy ジョブには
# contents: write を与えず、リポジトリへの書き込みは commit-years-data ジョブに分離する
env:
  REGION: asia-northeast1
  SERVICE: perldoc-jp
  IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/perldoc-jp/app
  # schedule / repository_dispatch では github.sha が変わらないまま中身の
  # 異なるイメージ (translation 更新分) が作られ、:<sha> タグは上書きで
  # 移動してしまう。ビルドを後から特定できるよう run 毎に一意なタグも
  # 付け、smoke test とデプロイはそちらを参照する
  # (run_id は re-run で同一になるため run_attempt まで含める)
  TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      # 外部 action はコミット SHA にピン留めする (この workflow は WIF の
      # デプロイ資格情報を扱うため、タグの付け替えによる改竄の影響を受けない
      # ようにする)。更新時は SHA とコメントのバージョンを両方書き換えること
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # translation の HEAD を build-arg に渡し、translation が更新された
      # ときだけ databuild ステージのキャッシュを無効化する。
      # ls-remote の失敗をコマンド置換で握りつぶすと、空の TRANSLATION_COMMIT に
      # よって checkout が no-op になり pin されないまま進んでしまうため、
      # 空でないことを明示的に検証する
      - name: Resolve translation HEAD
        id: translation
        run: |
          sha=$(git ls-remote https://github.com/perldoc-jp/translation.git refs/heads/master | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            TRANSLATION_COMMIT=${{ steps.translation.outputs.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # ビルドで再導出された data/years.pl を取り出す (デプロイ成功後に
      # commit-years-data ジョブが master へ書き戻す)。同じ build-arg・
      # 直前の build-push-action が書いた registry buildcache を明示的に
      # 参照するため、builder のローカル状態 (GC 等) に関わらず databuild が
      # 再実行されることはない
      - name: Export data/years.pl
        run: |
          docker buildx build --target years-export \
            --build-arg TRANSLATION_COMMIT=${{ steps.translation.outputs.sha }} \
            --cache-from type=registry,ref=$IMAGE:buildcache \
            --output type=local,dest=years-out .

      - name: Upload data/years.pl
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: years-data
          path: years-out/years.pl
          retention-days: 1

      # 本番同等の構成 (PLACK_ENV=deployment・immutable DSN・slim イメージ) は
      # databuild の prove (PLACK_ENV=build) では検証されないため、push した
      # イメージを Cloud Run 相当の FS 制約で起動して開通確認してからデプロイする
      - name: Smoke test image
        shell: bash
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp \
            -e PORT=8080 -p 8080:8080 "$IMAGE:$TAG"
          trap 'docker logs smoke' ERR
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep 'perldoc.jp' > /dev/null
          curl -fsS -o /dev/null http://127.0.0.1:8080/docs/perl/perl.pod
          curl -fsS http://127.0.0.1:8080/translators | grep '年</h2>' > /dev/null
          curl -fsS http://127.0.0.1:8080/static/docs.json | grep 'Acme::Bleach' > /dev/null
          docker rm -f smoke

      # サービス設定を毎回明示し、デプロイの実行順序に依存せず
      # self-correcting にする。特に concurrency は Starlet の
      # --max-workers 4 と一致させる (デフォルト 80 では 4 ワーカーに
      # 大量のリクエストが詰まる)。
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$TAG" \
            --region "$REGION" \
            --service-account "perldoc-jp-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --execution-environment gen2 \
            --memory 1Gi --cpu 1 \
            --min-instances 0 --max-instances 3 \
            --concurrency 4 --cpu-boost \
            --timeout 60 --port 8080 \
            --allow-unauthenticated \
            --quiet

  # デプロイ成功後、ビルドで再導出された data/years.pl に変更があれば master へ
  # 自動コミットする。実装と設計理由は呼び出し先ファイルを参照
  # (パス参照なので、ファイルをリネームするとここがエラーになって気づける)
  commit-years-data:
    needs: deploy
    permissions:
      contents: write
    uses: ./.github/workflows/commit-years-data.yml
