name: Deploy

on:
  push:
    branches:
      - master
  # translation 通知 (workflow_dispatch) の取りこぼし保険 (JST 4:00)
  schedule:
    - cron: '0 19 * * *'
  # 手動実行と、perldoc-jp/translation からの通知 (専用 GitHub App の
  # installation token による起動。docs/cloud-run.md §9) の両方が使う
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# permissions はジョブレベルで宣言する。リポジトリへ書き込む years ジョブと、
# WIF の資格情報を扱う deploy ジョブを分け、どちらにも両方を持たせない
jobs:
  # data/years.pl をビルドの前に更新する。
  #
  # PJP::M::YearData->build は対象年 (translation の最新イベントの前年) より前を
  # 既存の data/years.pl から seed としてそのまま引き継ぎ、対象年以降だけを
  # git 履歴から再構築する。この書き戻しが無いと、ある年が再導出の窓から外れた
  # 時点でその年の統計がシードのコミット時点で凍結される。
  #
  # ビルドより前に置いて、その結果のコミットをビルドのソースにする。こうすると
  # 「master にコミットされている years.pl」と「イメージが読む years.pl」が
  # 構造的に一致し、ビルドの成果物を GitHub へ取り出す経路が要らなくなる。
  #
  # GITHUB_TOKEN による push は GitHub の再帰防止によりワークフローを
  # 再トリガーしないため、デプロイのループは起きない。
  years:
    runs-on: ubuntu-latest
    # 生成に要るのは translation の git 履歴と既存の data/years.pl だけで DB は
    # 触らないが、script/create_data.pl は冒頭で PJP::M を useall するため CPAN
    # 依存一式が要る。ubuntu-latest の system perl とは版が合わないので、
    # Dockerfile の base と同じイメージの中で走らせる
    container: perl:5.44-trixie
    # コンテナジョブの run は既定が sh になる (bash ではない)。ここは [[ ]] を使う
    timeout-minutes: 45
    permissions:
      contents: write
    # このジョブは master へ直接 push する。environment の deployment branch policy を
    # master 限定にすることで、workflow_dispatch で別の ref を選んでもジョブ開始前に
    # 拒否される。secret は置かず、ref を絞るためだけの environment
    # (§7)。以前は書き込みが deploy の後段にあり、gcp-production の branch policy が
    # 間接的にこの境界を担っていたが、ビルドの前に移したので自前で持つ必要がある
    environment: master-write
    defaults:
      run:
        shell: bash
    outputs:
      # ビルドのソースにするコミット。書き戻しが無い run や、競合で捨てた run では
      # github.sha のまま
      app-sha: ${{ steps.years.outputs.app-sha }}
      # years.pl の再導出とイメージのビルドで同じ translation を見るために、
      # 解決した SHA を deploy ジョブへ渡す
      translation-sha: ${{ steps.translation.outputs.sha }}

    steps:
      # 外部 action はコミット SHA にピン留めする (この workflow は WIF の
      # デプロイ資格情報と master への書き込み権限を扱うため、タグの付け替えに
      # よる改竄の影響を受けないようにする)。更新時は SHA とコメントのバージョンを
      # 両方書き換えること
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve translation HEAD
        id: translation
        run: |
          sha=$(git ls-remote https://github.com/perldoc-jp/translation.git refs/heads/master | cut -f1)
          # 値は deploy ジョブの build-arg として buildx へ渡るので、
          # 「空でない」より強く形式そのものを確かめる。bash の =~ は文字列全体に
          # 対して照合するので、複数行が紛れ込んでも通らない
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # local/ の XS モジュールは Perl の API バージョンとアーキテクチャに縛られる。
      # 以前はキーに 5.42 を直書きしていたため、Renovate が container: だけを
      # 5.44 に上げたときに 5.42 でビルドしたキャッシュが当たり、
      # "Perl API version v5.42.0 of XS.c does not match v5.44.0" で落ちた。
      # 実際に動いている perl から導出して、イメージの更新に自動で追従させる
      - name: Resolve Perl ABI
        id: perl
        run: |
          abi=$(perl -MConfig -e 'print "$Config{api_versionstring}-$Config{archname}"')
          [[ -n "$abi" ]]
          echo "abi=$abi" >> "$GITHUB_OUTPUT"

      # cpanfile.snapshot と Perl の ABI が変わらない限り再利用する。Deploy は
      # 日次 schedule で動くので、7 日の未使用による eviction には基本かからない
      - name: Restore CPAN dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local
          key: perl-deps-${{ steps.perl.outputs.abi }}-trixie-${{ hashFiles('cpanfile.snapshot') }}

      # Dockerfile の base / deps ステージと同じ手順。cpm --resolver snapshot は
      # Carton::Snapshot を require するので Carton が先に要る。
      # perl:*-trixie は buildpack-deps 由来で gcc/g++/make と各種 dev ライブラリを
      # 持つが、Dockerfile と同じ集合を明示して XS のビルド条件を揃える
      - name: Install CPAN dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends wget gcc g++ make sqlite3 git
          cpm install -g Carton
          cpm install --resolver snapshot --no-default-resolvers --show-build-log-on-failure

      # create_data.pl が全履歴の git log を使うため、コミット履歴付き
      # (blob は checkout 分のみ) で取得する。Dockerfile の databuild と同じ
      - name: Fetch translation
        env:
          TRANSLATION_SHA: ${{ steps.translation.outputs.sha }}
        run: |
          rm -rf assets/translation
          git clone --filter=blob:none https://github.com/perldoc-jp/translation.git assets/translation
          git -C assets/translation checkout --quiet "$TRANSLATION_SHA"

      # config/build.pl は Dockerfile と同じ /usr/src/app の絶対パスを前提にして
      # いる (assets_dir)。設定を CI 用に分岐させず、イメージの中と同じ配置を作って
      # そこで走らせる。git 操作は symlink を通さず既定の作業ディレクトリで行う
      - name: Regenerate data/years.pl
        env:
          PLACK_ENV: build
          PERL5LIB: /usr/src/app/local/lib/perl5
        run: |
          rm -rf /usr/src/app
          ln -s "$GITHUB_WORKSPACE" /usr/src/app
          cd /usr/src/app
          perl script/update-years.pl
          test -s data/years.pl

      # 差分があれば master へ書き戻し、ビルドのソースにする SHA を出力する
      - name: Commit data/years.pl if changed
        id: years
        run: |
          # environment master-write の branch policy がこの run を master に
          # 限定している。environment は参照されただけでも branch policy 無しで
          # 自動作成されるため、設定漏れに黙って通されないようここでも確かめる。
          # yml 内の検査は workflow_dispatch では yml ごと差し替えられるので
          # 境界にはならない。境界は environment 側で、これはその設定漏れに
          # 気づくための保険 (§7)
          test "$GITHUB_REF" = 'refs/heads/master'

          # コンテナジョブは root で走る一方、workspace はランナーのユーザ所有の
          # ままマウントされるため、git の dubious ownership 検査に引っかかる。
          # actions/checkout は自分の実行中だけ一時的な HOME へ safe.directory を
          # 足して後始末するので、後続の run step には残らない。
          # 引っかかった git は「リポジトリが無い」ものとして振る舞い、git diff は
          # --no-index の usage を、git config は not in a git directory を出す
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if git diff --quiet -- data/years.pl; then
            echo 'data/years.pl: no changes'
            echo "app-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/years.pl
          git commit -m 'data/years.pl を最新の再導出結果で更新する'

          # if 複合コマンドの直後の $? は if 自身の終了状態 (0) になるので、
          # push の終了状態は || で明示的に捕まえる
          push_status=0
          git push origin HEAD:master || push_status=$?
          if [ "$push_status" -eq 0 ]; then
            echo "app-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # push の失敗をすべて競合として扱うと、権限不足・branch protection・
          # 通信障害まで成功扱いになる。remote が生成元から動いたことを
          # 確かめられたときだけ捨てる。捨てた場合は github.sha のままビルドする
          # (master が進んだということは後続の run があり、書き戻しはそちらに任せる)
          git fetch --no-tags origin master || exit "$push_status"
          remote=$(git rev-parse FETCH_HEAD)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "master has moved to $remote; dropping this run's data/years.pl"
            echo "app-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'push failed although master did not advance' >&2
          exit "$push_status"

  deploy:
    needs: years
    runs-on: ubuntu-latest
    # ビルド・smoke test・デプロイをこの 1 ジョブで行う。ビルドを別の workflow
    # ファイルへ分けることはできない: §5 の WIF attribute-condition が
    # assertion.workflow_ref を deploy.yml に固定しているため、別ファイルからは
    # Artifact Registry への push の認証が取れない。同じファイル内のジョブ分割は
    # 自由だが、1 回のビルドで 2 つのレジストリへ push する以上、GHCR と GCP の
    # 資格情報は同じジョブに揃っている必要がある
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      # GHCR への push に要る。GITHUB_TOKEN で足りるので secret は増えない
      packages: write
    # GCP の識別子 (project ID / number) は deterministic URL の構成要素になる
    # ため §7 の分類で secret に置く。environment の branch policy が master のみ
    # を許可する (cloudflare-production と同じ境界)。secret にすると GitHub が
    # ログ中の値 (gcloud が表示する service URL 内の project number を含む) を
    # マスクする効果もある
    environment: gcp-production
    # env は deploy ジョブだけが使うためジョブレベルに置く
    # (environment secret はこのジョブでしか解決できない)
    env:
      REGION: asia-northeast1
      SERVICE: perldoc-jp
      # service は (project, region, service) で識別される。片方でも省くと
      # gcloud の設定 (core/project・run/region) から解決され、別 project や
      # 別 region の同名 service を操作しうる。docs/cloud-run.md の手動手順は
      # 既に両方を渡している
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/perldoc-jp/app
      # smoke test が検査対象を取得する先。GHCR のイメージ名は小文字でなければ
      # ならず、github.repository (perldoc-jp/perldoc.jp) はその条件を満たす。
      # リポジトリ名が変わればこの名前も変わるが、そのときは §5 の
      # attribute-condition が先に fail-closed で落ちる
      GHCR_IMAGE: ghcr.io/${{ github.repository }}/app
      # Starlet のワーカー数。Cloud Run の container concurrency と一致させる
      # (デフォルト 80 では 4 ワーカーに大量のリクエストが詰まる)。両方へ同じ値を
      # 渡すことで、一致がコメント頼みでなくなる
      STARLET_MAX_WORKERS: '4'
      # イメージのタグは run ごとに一意にする。schedule / workflow_dispatch
      # (translation 通知) では commit が変わらないまま中身の異なるイメージ
      # (translation 更新分) が作られるため、sha だけのタグはビルドを特定できない
      # (run_id は re-run で同一になるため run_attempt まで含める)
      TAG: ${{ needs.years.outputs.app-sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # years ジョブが data/years.pl を書き戻していれば、そのコミットをビルドの
      # ソースにする。書き戻しが無い run では github.sha と同じ値になる
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.years.outputs.app-sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # WIF provider と SA email は secret から構築する。project number /
          # project ID を variable として公開しないため (§7)。値を変えるときは
          # docs/cloud-run.md §5 の作成コマンドと一致させること
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/perldoc-jp
          service_account: perldoc-jp-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          # Cloud Audit Logs に run_id / run_attempt を残し、WIF の監査ログから
          # どの GitHub Actions run が認証したか追跡できるようにする
          request_reason: gha:${{ github.run_id }}:${{ github.run_attempt }}

      # SDK の版も固定する。gcloud は run ごとに新しい版が降ってくると、
      # デプロイの引数解釈や既定値の変更がそのまま本番の挙動差になる。
      # 上げるときは §8 の手動手順をその版で一度通してから上げること
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '584.0.0'

      # buildx が Artifact Registry へ push するための credential helper を仕込む。
      # helper はその時点の active service account の short-lived credentials を
      # 返すので、アクセストークンを自分で持ち回らずに済む
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # GHCR への push は GITHUB_TOKEN で行う。この workflow は WIF のデプロイ
      # 資格情報と同じジョブで動くため、docker login 1 行で済むところに外部 action
      # を増やさない。
      # 上の configure-docker より後に置く。docker login は既存の設定に自分の
      # エントリを足すだけだが、gcloud auth configure-docker は設定ファイルを
      # 書き直すため、逆順にすると GHCR の資格情報の扱いが gcloud 側の実装に依る
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # runtime を作り、同じビルド結果を GHCR と Artifact Registry の両方へ
      # push する。tag を 2 つ渡した 1 回のビルドなので、両レジストリに入るのは
      # バイト列として同一の manifest であり、digest も一致する。
      #
      # test ステージの /tests-passed への COPY があるため、prove を通らずに
      # runtime が完成することは構造的にない (Dockerfile 参照)。
      #
      # provenance と sbom は明示的に切る。タグを 2 つ渡したビルドで有効にすると、
      # provenance の subject が両方のイメージ参照を並べた 1 つの配列になり、その
      # attestation がそのまま両レジストリへ push される (実測。docs/cloud-run.md
      # 11-1)。公開している GHCR 側に Artifact Registry の参照 (= §7 で secret
      # として扱う project ID) を載せないために切る。
      # attestation は Cloud Run の要件ではなく、docker/build-push-action が
      # public リポジトリで既定的に付けていたものを踏襲していただけなので、
      # 落としても失うものは無い
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # build record artifact と job summary には build inputs (project ID 入りの
        # image tag / cache 参照) がそのまま入る。§7 の分類ではどちらも出せない
        # (artifact は公開リポジトリでは実質公開で、secret マスクも効かない)
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: .
          target: runtime
          # Cloud Run は linux/amd64 のみ。ランナーのアーキテクチャへの暗黙の
          # 依存を残さず、設定として固定する
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}
          # GHCR のパッケージをこのリポジトリに紐づけ、パッケージのページから
          # 出所を辿れるようにする。run ごとに値が変わるラベル (created や
          # revision) は付けない。中身の同じビルドで digest まで毎回変わると、
          # 内容の同じ Cloud Run リビジョンが日次で積み上がる
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            TRANSLATION_COMMIT=${{ needs.years.outputs.translation-sha }}
          # ビルドキャッシュは Actions Cache に置く。Artifact Registry の
          # registry cache は使わない (GitHub-hosted runner が引くと、そのたびに
          # インターネットへの data transfer out になる)。
          # scope=runtime を書くのはこのジョブだけで、PR (test.yml の
          # runtime-test) はこれを読んで自分の scope=runtime-pr へ書く。
          # キャッシュが無い状態でもビルドは通る (フルビルドになるだけ)
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      # 「smoke test で検査するもの」と「Cloud Run へデプロイするもの」が同じ
      # イメージであることを digest で確かめる。タグ名は両レジストリで同じ文字列に
      # しているが、同一性の根拠はタグではなく digest に置く。
      #
      # 引くのは両レジストリの manifest 1 個ずつ (数 KB) で、レイヤは落とさない。
      # Artifact Registry 側も同じ imagetools で引く。gcloud の
      # artifacts docker images describe でも digest は取れるが、タグ参照の可否と
      # 出力フィールド名という 2 つの前提が増えるので、GHCR 側と同じ経路に揃える
      - name: Verify the pushed digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          for ref in "$GHCR_IMAGE:$TAG" "$IMAGE:$TAG"; do
            pushed=$(docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' "$ref")
            if [ "$pushed" != "$DIGEST" ]; then
              echo "$ref: expected $DIGEST but got $pushed" >&2
              exit 1
            fi
          done

          echo "digest: $DIGEST"

      # smoke test の対象は GHCR が実際に保持しているものにする (レジストリへの
      # 往復も検証範囲に含める)。buildx の docker-container ドライバは --push しても
      # ローカルの daemon には load しないため、明示的に pull する。
      # 参照をタグではなく digest で書くので、検査対象が直前で照合した digest と
      # 同じものであることは、参照そのものから読める
      - name: Pull the image from GHCR
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "$GHCR_IMAGE@$DIGEST"

      # 本番同等の構成 (PLACK_ENV=deployment・immutable DSN・slim イメージ) は
      # databuild の prove (PLACK_ENV=build) では検証されないため、Cloud Run 相当の
      # FS 制約で起動して開通確認する。使うスクリプトは PR の test.yml と同じもの。
      #
      # script/smoke-test.pl は手元に無いイメージを docker run の自動 pull で
      # 取りに行くが、渡している参照は GHCR のものなので、その pull も
      # Artifact Registry には向かない
      - name: Smoke test image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ./script/smoke-test.pl "$GHCR_IMAGE@$DIGEST"

      # gcloud run deploy はリビジョンのテンプレートに nonce ラベルを付けるため、
      # イメージと引数が前回と同じでも毎回新しいリビジョンを作る。中身の同じ
      # ビルドが日次で積み上がるのを避けるため、稼働中のリビジョンが指す digest を
      # 読み、ビルドした digest と一致すればデプロイ自体を飛ばす (#85)。
      #
      # --image は常に digest 参照で渡している (下の Deploy to Cloud Run 参照) ので、
      # spec.template.spec.containers[0].image はタグではなく `IMAGE@sha256:...` の
      # 形で読める。describe が失敗する場合 (初回デプロイ前でサービスが未作成、
      # 権限不足など) は current が空になり一致しないので、fail-closed でデプロイ
      # 側に倒れる
      - name: Check the currently deployed digest
        id: current
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          current=$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$REGION" \
            --format='value(spec.template.spec.containers[0].image)' \
            2>/dev/null || true)

          if [ "$current" = "$IMAGE@$DIGEST" ]; then
            echo "already deployed: $current"
            echo 'same-digest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'same-digest=false' >> "$GITHUB_OUTPUT"
          fi

      # サービス設定を毎回明示し、デプロイの実行順序に依存せず
      # self-correcting にする (このステップを飛ばした run では起きない。
      # docs/cloud-run.md §4)。
      #
      # --image は digest で渡す。タグで渡すと、Cloud Run がタグを解決する時点で
      # 何を引くかが、smoke test を通したイメージと同じである保証を持たない
      #
      # --set-env-vars は列挙外の既存変数を消す。アプリが必要とする環境変数は
      # STARLET_MAX_WORKERS の 1 つで完全列挙なので、dashboard 等で足された
      # 変数が残らない宣言的な動作にする (Worker の通常変数と同じ方針)。
      # ここで STARLET_MAX_WORKERS を渡すのは、Dockerfile の CMD にある
      # ${STARLET_MAX_WORKERS:-4} と --concurrency の一致を、同じ 1 つの値から
      # 導くため
      #
      # --allow-unauthenticated は付けない。公開 IAM (allUsers の run.invoker) は
      # §4 の初回作成時に一度だけ設定し、デプロイ用 SA には IAM を書き換えられる
      # run.admin ではなく run.developer だけを与えている (§5)。
      # 公開設定はデプロイでは自己修復されないため、消えていれば §8 の
      # get-iam-policy 確認で気づく
      - name: Deploy to Cloud Run
        if: steps.current.outputs.same-digest != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --image "$IMAGE@$DIGEST" \
            --region "$REGION" \
            --service-account "perldoc-jp-run@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --execution-environment gen2 \
            --memory 1Gi --cpu 1 \
            --min-instances 0 --max-instances 3 \
            --concurrency "$STARLET_MAX_WORKERS" --cpu-boost \
            --set-env-vars "STARLET_MAX_WORKERS=$STARLET_MAX_WORKERS" \
            --timeout 60 --port 8080 \
            --quiet

      # GHCR のパッケージは公開していて、手元で本番と同じイメージを起動する用途に
      # 使える。run ごとのタグ名を知らなくても引けるよう、smoke test とデプロイまで
      # 通った digest に latest を付ける。デプロイを飛ばした run では、その digest に
      # は前回の run で既に latest が付いているので、このステップも飛ばす。
      #
      # imagetools create が作るのは元の manifest を指す index なので、:latest
      # 自身の digest は per-run タグのそれとは異なりうる。同一性の根拠に使うのは
      # per-run タグのほうで、latest は入口にすぎない。
      #
      # continue-on-error にするのは、ここまででデプロイが終わっているため。
      # 利便のためのタグ付けに失敗しただけで、成功した本番デプロイの run を
      # 赤くしない (失敗はステップの注釈として残る)
      - name: Tag the deployed image as latest on GHCR
        if: steps.current.outputs.same-digest != 'true'
        continue-on-error: true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$GHCR_IMAGE:latest" "$GHCR_IMAGE@$DIGEST"

  # Cloudflare のゾーンのキャッシュを purge する。
  #
  # Worker の内側のキャッシュ (fetch の cf 設定) は TTL が 24 時間ある。配信
  # データが変わるのは Cloud Run のデプロイのときだけなので、TTL で鮮度を
  # 保つ代わりに、ここで消す (docs/cloud-run.md §10)。外側の Workers Cache は
  # ゾーンに属さず purge できないため、古い応答が残るのはこの purge から最大
  # 1 時間になる。
  #
  # deploy ジョブが digest の一致でデプロイを飛ばした run でも purge する。
  # 「この run がデプロイしたか」を条件にすると、デプロイした run が下の待ち
  # 時間のあいだに後続の run にキャンセルされた場合 (concurrency の
  # cancel-in-progress)、後続の run は同じ digest を見てデプロイを飛ばすので、
  # purge がどの run からも呼ばれなくなる。毎回 purge する費用は小さい。purge
  # しなくてもエントリは 24 時間で失効するので、日次の purge が増やす origin への
  # 取得は、URL ごとに 1 日あたり高々 1 回である。
  #
  # deploy ジョブが失敗した run では purge しない (needs の既定)。origin が
  # 壊れているかもしれないときに、origin の代わりに応答できるキャッシュを
  # 捨てないためである。上のキャンセルの直後にその run まで失敗した場合は
  # purge が抜けるが、次に成功する run (遅くとも翌日の schedule) か、内側の
  # TTL の 24 時間で解消する。
  #
  # deploy ジョブと分けるのは、1 つのジョブが 1 つの environment しか持てない
  # ためである。GCP の資格情報と Cloudflare の token を同じジョブに置かない
  purge:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # purge 専用の token だけを置く environment (§7)。Worker をデプロイする
    # token (cloudflare-production) とは分ける。branch policy は master のみ
    environment: cloudflare-cache-purge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cloud Run のトラフィックの切り替えは即時ではなく、移行のあいだは新旧
      # どちらのリビジョンにもリクエストが届きうる (Cloud Run のドキュメント
      # "Rollbacks, gradual rollouts, and traffic migration")。gcloud run deploy の
      # 直後に purge すると、旧リビジョンの応答が空になった内側のキャッシュへ
      # 入り、次の purge まで最大 24 時間残りうる。移行にかかる時間は公表されて
      # いないので、120 秒は実測に基づかない余裕である。待つあいだは古い応答が
      # 配られ続けるだけで、害は無い。
      #
      # デプロイを飛ばした run では待つ必要が無いが、条件を分けない。直前の run が
      # デプロイの直後にキャンセルされていた場合は、この run が移行の完了を待つ
      # 役を引き継ぐ
      - name: Wait for the traffic migration to finish
        run: sleep 120

      # CLOUDFLARE_ZONE_ID は認証情報でも URL の構成要素でもないので repository
      # variable に置く (§7)。どちらかが未設定ならスクリプトが非ゼロで終わる
      - name: Purge the Cloudflare zone cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: ./worker/scripts/purge-cache.sh
