name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # 行末の空白やタブ混じりのインデントは、後から触った差分に紛れて読みにくく
  # なるので、入った時点で気づけるようにする
  whitespace:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # 比較対象のコミットまで遡れるようにする
        fetch-depth: 0

    - name: Check whitespace errors
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: |
        # push の初回や force push では before が 0 埋めになり、比較対象が無い
        if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ]; then
          echo 'no base commit to compare against; skipping'
          exit 0
        fi
        # force push 前の位置など、現在の ref から到達できない commit は
        # fetch-depth: 0 でも手元に無い。明示的に取りに行き、それでも
        # 無ければ (GC 済み等) 比較を諦める
        if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          git fetch --no-tags origin "$BASE" || {
            echo "base commit $BASE is unavailable; skipping"
            exit 0
          }
        fi
        # 終点に HEAD を明示する。省くと作業ツリー (生成物を含む) が対象になる
        git diff --check "$BASE" HEAD --

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    # app イメージを GHA キャッシュ付きで事前ビルドする。make ci の
    # docker compose up は同名イメージが存在すればビルドしないため、
    # ここで load したイメージがそのまま使われる。キャッシュ書き込みは
    # master push のみ (デフォルトブランチのキャッシュは fork PR を含む
    # 全 PR から読める)
    - name: Build app image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        target: app
        tags: perldocjp-app:latest
        load: true
        cache-from: type=gha
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

    - name: Run test
      run: |
        make ci

  # 本番用イメージの経路 (databuild → test → runtime) は app target から分岐
  # した先にあり、上の test ジョブでは一切ビルドされない。master へマージして
  # 初めて Deploy で失敗すると手戻りが大きいため、PR でも runtime target を
  # ビルドして smoke test まで回す。translation は deploy.yml と同じく HEAD の
  # SHA に固定し、キャッシュの無効化を translation の更新に連動させる。
  #
  # push では回さない。master への push では deploy.yml が同じ runtime を
  # ビルドして同じ smoke test を回すため、ここで回すと同一イメージを 2 回
  # (しかも互いに読めない別のキャッシュで) 作ることになる。gha キャッシュへの
  # 書き込みは deploy.yml が引き継ぐ
  runtime-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    # pin の規則は deploy.yml と共有のスクリプトに一本化されている。ここが
    # deploy と食い違うと、PR が deploy の作るものと違うイメージを検証してしまう
    - name: Resolve translation HEAD
      id: translation
      run: |
        sha=$(./script/translation.sh head)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    # キャッシュの scope を app イメージと分け、mode=max の書き込みが互いの
    # レイヤを追い出さないようにする。deploy.yml の registry cache は WIF の
    # 認証を要するため PR (fork を含む) からは読めず、ここでは使わない。
    # scope=runtime は deploy.yml (master push) が書く共有キャッシュ。
    # lib/ や script/ を触る PR は databuild レイヤがそこに無いため、
    # runtime-pr にも書いて同じ PR への連続 push でフルビルドを繰り返さない
    # ようにする (gha キャッシュは PR 単位に隔離されるので、読めるのは
    # 同じ PR の前回分だけ)
    - name: Build runtime image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        target: runtime
        tags: perldocjp-runtime:latest
        load: true
        build-args: |
          TRANSLATION_COMMIT=${{ steps.translation.outputs.sha }}
        cache-from: |
          type=gha,scope=runtime
          type=gha,scope=runtime-pr
        cache-to: type=gha,mode=max,scope=runtime-pr

    # years-export は runtime から参照されないので、上のビルドでは作られない。
    # deploy.yml はデプロイが成功した後にこのステージを使うため、壊れていても
    # 「本番へ反映された後に years.pl の書き戻しだけが失敗する」形になる。
    # runtime と同じ translation SHA・同じキャッシュで作るので、ここでの
    # 追加ビルドはほぼ全レイヤがキャッシュに当たる
    - name: Build years-export stage
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        target: years-export
        outputs: type=cacheonly
        build-args: |
          TRANSLATION_COMMIT=${{ steps.translation.outputs.sha }}
        cache-from: |
          type=gha,scope=runtime
          type=gha,scope=runtime-pr

    - name: Smoke test image
      run: ./script/smoke-test.sh perldocjp-runtime:latest

  # Worker は master への push で無条件に本番デプロイされる
  # (deploy-worker.yml) ため、PR 段階のゲートをここに置く。数十 ms で
  # 終わるので paths フィルタは付けず常に回す
  worker-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # wrangler は Node 22 以上を要求する。deploy-worker.yml と同じ版に固定する
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    # 実 workerd で起動するテストがあるので、依存を入れてから回す
    - name: Install dependencies
      working-directory: worker
      run: npm ci

    - name: Run worker tests
      working-directory: worker
      run: npm test
